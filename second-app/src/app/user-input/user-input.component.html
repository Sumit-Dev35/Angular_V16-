<form (ngSubmit)="onSubmit()">
  <div class="input-group">
    <p>
      <label for="initial-investment">Inital Investment</label>
      <input type="number" id="initial-investment" name='initial-investment' [(ngModel)]="initialInvestmentPrice">
    </p>
    <p>
      <label for="annual-investment">Annual Investment</label>
      <input type="number" id="annual-investment" name='annual-investment'[(ngModel)]="annualInvestmentPrice">
    </p>
  </div>
  <div class="input-group">
    <p>
      <label for="expected-return">Expected Return</label>
      <input type="number" id="expected-return" [(ngModel)]="expectedReturnPrice" name="expected-return">
    </p>
    <p>
      <label for="duration">Duration</label>
      <input type="number" id="duration" [(ngModel)]="duration" name="duration">
    </p>
  </div>
  <p>
    <button type="button" (click)="onSubmit()">Calculate</button>
  </p>
</form>
