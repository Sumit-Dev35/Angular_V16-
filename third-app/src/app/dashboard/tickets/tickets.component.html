<div>
  <ul>
    @for(ticket of tickets ; track ticket){
     <li>
      <app-ticket [data]="ticket" (completedTicket)="onCloseTicket($event)"></app-ticket>
     </li>
    }@empty {
      <p>No Tickets available</p>
    }
  </ul>
</div>
<article>
  <div id="new-ticket">
    <app-new-tickes (add)="onAddTicket($event)"></app-new-tickes>
  </div>
</article>
